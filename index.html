<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다국어 음성 대화</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1d2330; --muted: #6b7280;
    --line: #dde1e7; --accent: #2563eb; --rec: #dc2626; --sub: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --text: #e7eaf0; --muted: #9aa3b2;
      --line: #2c3340; --accent: #60a5fa; --rec: #f87171; --sub: #1e2740;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.25rem; margin: 4px 0 16px; }
  section {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px; margin-bottom: 14px;
  }
  h2 { font-size: 1rem; margin: 0 0 10px; }
  .langs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  label { font-size: .85rem; color: var(--muted); display: block; margin-bottom: 4px; }
  select {
    width: 100%; padding: 10px; font-size: 1rem; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  .row + .row { margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--line); }
  .row-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .row-head strong { font-size: 1rem; }
  .row-head .lang-tag { color: var(--muted); font-size: .85rem; font-weight: normal; }
  button.mic {
    border: none; border-radius: 999px; padding: 10px 16px; font-size: .95rem;
    background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap;
  }
  button.mic.on { background: var(--rec); }
  button.mic:disabled { opacity: .5; cursor: not-allowed; }
  .box {
    min-height: 64px; padding: 10px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 1.05rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  .box:empty::before { content: attr(data-placeholder); color: var(--muted); }
  .box .interim { color: var(--muted); }
  .trans {
    margin-top: 8px; padding: 10px; border-radius: 8px; background: var(--sub);
    font-size: 1.05rem; line-height: 1.5; min-height: 44px; white-space: pre-wrap; word-break: break-word;
  }
  .trans-wrap { display: flex; gap: 8px; align-items: stretch; margin-top: 8px; }
  .trans-wrap .trans { flex: 1; margin-top: 0; }
  button.speak {
    flex: none; width: 48px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); font-size: 1.2rem; cursor: pointer;
  }
  button.speak:disabled { opacity: .4; cursor: not-allowed; }
  button.speak.hint { animation: hint 1s ease-in-out infinite; border-color: var(--accent); }
  @keyframes hint { 50% { background: var(--sub); transform: scale(1.12); } }
  .trans:empty::before { content: attr(data-placeholder); color: var(--muted); }
  .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .auto { display: flex; align-items: center; gap: 6px; font-size: .95rem; cursor: pointer; }
  .auto input { width: 20px; height: 20px; margin: 0; }
  .actions button {
    background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 8px; padding: 8px 12px; cursor: pointer;
  }
  .notice { font-size: .85rem; color: var(--muted); margin: 0; }
  .notice.warn { color: var(--rec); }
</style>
</head>
<body>
<main>
  <h1>다국어 음성 대화</h1>

  <!-- 언어 메뉴 -->
  <section aria-labelledby="lang-title">
    <h2 id="lang-title">언어 선택</h2>
    <div class="langs">
      <div>
        <label for="lang-q">질문하는 사람</label>
        <select id="lang-q"></select>
      </div>
      <div>
        <label for="lang-a">대답하는 사람</label>
        <select id="lang-a"></select>
      </div>
    </div>
  </section>

  <!-- 질문 / 대답 의사소통 공간 -->
  <section aria-labelledby="talk-title">
    <h2 id="talk-title">대화</h2>

    <div class="row" data-role="q">
      <div class="row-head">
        <strong>질문 <span class="lang-tag"></span></strong>
        <button class="mic" type="button">🎤 말하기</button>
      </div>
      <div class="box" data-placeholder="버튼을 누르고 말하면 여기에 글로 써집니다"></div>
      <div class="trans-wrap">
        <div class="trans" data-placeholder="상대 언어 번역"></div>
        <button class="speak" type="button" aria-label="번역 읽기">🔊</button>
      </div>
    </div>

    <div class="row" data-role="a">
      <div class="row-head">
        <strong>대답 <span class="lang-tag"></span></strong>
        <button class="mic" type="button">🎤 말하기</button>
      </div>
      <div class="box" data-placeholder="버튼을 누르고 말하면 여기에 글로 써집니다"></div>
      <div class="trans-wrap">
        <div class="trans" data-placeholder="상대 언어 번역"></div>
        <button class="speak" type="button" aria-label="번역 읽기">🔊</button>
      </div>
    </div>

    <div class="actions">
      <label class="auto"><input type="checkbox" id="auto-read"> 🔊 자동 읽기</label>
      <button type="button" id="clear">지우기</button>
    </div>
  </section>

  <p class="notice" id="notice"></p>
</main>

<script>
// 번역 서버 주소 (worker.js 를 배포한 URL). 비워두면 번역 없이 받아쓰기만 동작합니다.
const TRANSLATE_ENDPOINT = "https://translate-chat.tamornet7.workers.dev";

// speech: 음성인식·읽기 언어 코드, tr: Azure 번역 언어 코드
const LANGUAGES = [
  { name: "한국어", speech: "ko-KR", tr: "ko" },
  { name: "English", speech: "en-US", tr: "en" },
  { name: "日本語", speech: "ja-JP", tr: "ja" },
  { name: "中文(简体)", speech: "zh-CN", tr: "zh-Hans" },
  { name: "Tiếng Việt", speech: "vi-VN", tr: "vi" },
  { name: "ภาษาไทย", speech: "th-TH", tr: "th" },
  { name: "Bahasa Indonesia", speech: "id-ID", tr: "id" },
  { name: "Español", speech: "es-ES", tr: "es" },
  { name: "Français", speech: "fr-FR", tr: "fr" },
  { name: "Deutsch", speech: "de-DE", tr: "de" },
  { name: "Русский", speech: "ru-RU", tr: "ru" },
  { name: "Монгол", speech: "mn-MN", tr: "mn-Cyrl" },
  { name: "O'zbek", speech: "uz-UZ", tr: "uz" },
];

const selQ = document.getElementById("lang-q");
const selA = document.getElementById("lang-a");
const notice = document.getElementById("notice");

for (const sel of [selQ, selA]) {
  LANGUAGES.forEach((l, i) => sel.add(new Option(l.name, i)));
}
selQ.value = 0;
selA.value = 1;

const rows = {};
for (const el of document.querySelectorAll(".row")) {
  rows[el.dataset.role] = {
    el,
    tag: el.querySelector(".lang-tag"),
    btn: el.querySelector(".mic"),
    box: el.querySelector(".box"),
    trans: el.querySelector(".trans"),
    speak: el.querySelector(".speak"),
    finalText: "",
  };
}

// 질문 행은 질문자 언어로 말하고 대답자 언어로 번역, 대답 행은 그 반대
function langsFor(role) {
  const q = LANGUAGES[selQ.value], a = LANGUAGES[selA.value];
  return role === "q" ? { from: q, to: a } : { from: a, to: q };
}

function refreshTags() {
  for (const role of ["q", "a"]) {
    const { from, to } = langsFor(role);
    rows[role].tag.textContent = "(" + from.name + ")";
    rows[role].trans.dataset.placeholder = to.name + " 번역";
  }
}
// 언어를 고르면 자동 읽기를 켬 (끄고 싶으면 스위치로 끌 수 있음)
function onLangChange() {
  refreshTags();
  retranslateAll();
  setAutoRead(true);
}
selQ.addEventListener("change", onLangChange);
selA.addEventListener("change", onLangChange);
refreshTags();

function setNotice(msg, warn) {
  notice.textContent = msg || "";
  notice.className = "notice" + (warn ? " warn" : "");
}

// ---- 번역 ----
async function translate(text, from, to) {
  if (!TRANSLATE_ENDPOINT || !text.trim()) return "";
  if (from.tr === to.tr) return text;
  const res = await fetch(TRANSLATE_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ q: text, source: from.tr, target: to.tr }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "번역 실패 (" + res.status + ")");
  return data.translatedText || "";
}

// auto: 받아쓰기에서 온 번역이면 true (언어만 바꿨을 때는 자동으로 읽지 않음)
async function translateRow(role, auto) {
  const row = rows[role];
  if (!TRANSLATE_ENDPOINT) return;
  const { from, to } = langsFor(role);
  const text = row.finalText;
  try {
    const out = await translate(text, from, to);
    if (row.finalText !== text) return;
    row.trans.textContent = out;
    if (auto) autoSpeak(role);
  } catch (e) {
    setNotice(e.message, true);
  }
}

function retranslateAll() {
  translateRow("q");
  translateRow("a");
}

// ---- 음성인식 ----
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let active = null; // { role, rec }

if (!Recognition) {
  for (const r of Object.values(rows)) r.btn.disabled = true;
  setNotice("이 브라우저는 음성인식을 지원하지 않습니다. Chrome, Edge, Safari 를 사용해 주세요.", true);
} else if (!TRANSLATE_ENDPOINT) {
  setNotice("번역 서버가 설정되지 않아 받아쓰기만 동작합니다. (index.html 의 TRANSLATE_ENDPOINT)");
}

function renderBox(row, interim) {
  row.box.textContent = row.finalText;
  if (interim) {
    const span = document.createElement("span");
    span.className = "interim";
    span.textContent = (row.finalText ? " " : "") + interim;
    row.box.appendChild(span);
  }
}

function stop() {
  if (active) stopRec(active.rec);
}

// 휴대폰이 stop 을 무시하는 경우가 있어 잠시 뒤에도 켜져 있으면 강제로 끔
function stopRec(rec) {
  if (!active || active.rec !== rec) return;
  rec.stop();
  setTimeout(() => {
    if (active && active.rec === rec) rec.abort();
  }, 1500);
  setTimeout(() => {
    if (active && active.rec === rec) rec.onend();
  }, 3000);
}

function start(role) {
  const row = rows[role];
  const { from } = langsFor(role);
  const rec = new Recognition();
  rec.lang = from.speech;
  rec.interimResults = true;
  rec.continuous = true;

  row.finalText = "";
  row.lastHeard = "";
  row.trans.textContent = "";
  row.pendingSpeak = false;
  clearTimeout(row.trTimer);
  renderBox(row, "");

  // 모바일 Chrome 은 앞 결과를 누적해서 다시 보내므로, 매번 전체 결과로 다시 만들고 겹치는 부분은 합칩니다
  rec.onresult = (ev) => {
    const segs = [];
    let interim = "";
    for (let i = 0; i < ev.results.length; i++) {
      const t = ev.results[i][0].transcript.trim();
      if (!t) continue;
      if (!ev.results[i].isFinal) { interim = t; continue; }
      const last = segs[segs.length - 1];
      if (last && t.startsWith(last)) segs[segs.length - 1] = t;
      else if (!(last && last.startsWith(t))) segs.push(t);
    }
    const last = segs[segs.length - 1];
    if (last && interim.startsWith(last)) interim = interim.slice(last.length).trim();

    const text = segs.join(" ");
    if (text !== row.finalText) {
      row.finalText = text;
      // 말하는 동안 매번 번역하지 않고 잠깐 멈췄을 때 한 번만 번역 (하루 한도 절약)
      clearTimeout(row.trTimer);
      row.trTimer = setTimeout(() => {
        row.trTimer = null;
        translateRow(role, true);
      }, 700);
    }
    renderBox(row, interim);

    // 자동 읽기가 켜져 있으면 새 말이 1.5초 동안 없을 때 마이크를 끄고 읽음 (⏹ 를 누른 것과 같음)
    // Android 는 조용할 때도 같은 결과를 계속 보내므로, 내용이 바뀔 때만 시간을 다시 잼
    const heard = text + "|" + interim;
    if (heard === row.lastHeard) return;
    row.lastHeard = heard;
    clearTimeout(row.silenceTimer);
    if (autoRead.checked && (text || interim)) {
      row.silenceTimer = setTimeout(() => stopRec(rec), 1500);
    }
  };
  rec.onerror = (ev) => {
    if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
      setNotice("마이크 권한이 필요합니다. 브라우저 설정에서 허용해 주세요.", true);
    } else if (ev.error === "no-speech") {
      setNotice("말소리가 들리지 않았어요. 🎤 를 누르고 다시 말해 주세요.");
    } else if (ev.error !== "aborted") {
      setNotice("음성인식 오류: " + ev.error, true);
    }
  };
  rec.onend = () => {
    clearTimeout(row.silenceTimer);
    // 기다리던 번역이 있으면 바로 번역
    if (row.trTimer) {
      clearTimeout(row.trTimer);
      row.trTimer = null;
      translateRow(role, true);
    }
    row.btn.classList.remove("on");
    row.btn.textContent = "🎤 말하기";
    renderBox(row, "");
    if (active && active.rec === rec) active = null;
    if (row.pendingSpeak) {
      row.pendingSpeak = false;
      autoSpeak(role);
    }
  };

  rec.start();
  active = { role, rec };
  row.btn.classList.add("on");
  row.btn.textContent = "⏹ 멈추기";
}

for (const [role, row] of Object.entries(rows)) {
  row.btn.addEventListener("click", () => {
    unlockSynth();
    const wasMine = active && active.role === role;
    stop();
    if (!wasMine) start(role);
  });
}

// ---- 읽기 (브라우저 내장 음성) ----
const synth = window.speechSynthesis;

// delayMs: 자동 읽기는 마이크가 완전히 꺼진 뒤 읽도록 잠시 기다림 (버튼으로 읽을 때는 바로 읽음)
// 자동 읽기가 시작되지 않으면 한 번 더 시도하고, 그래도 안 되면 🔊 버튼을 깜빡여 눌러 달라고 알림
function speak(role, delayMs = 0, retried = false) {
  const row = rows[role];
  const text = row.trans.textContent.trim();
  if (!synth || !text) return;
  stop(); // 읽는 소리가 마이크에 다시 들어가지 않도록 받아쓰기를 멈춤
  synth.cancel();
  row.speak.classList.remove("hint");
  const { to } = langsFor(role);
  const u = new SpeechSynthesisUtterance(text);
  u.lang = to.speech;
  const voices = synth.getVoices();
  const norm = (v) => v.lang.replace("_", "-");
  const voice = voices.find((v) => norm(v) === to.speech)
    || voices.find((v) => norm(v).startsWith(to.speech.slice(0, 2)));
  if (voice) u.voice = voice;

  const auto = delayMs > 0;
  let started = false;
  u.onstart = () => {
    started = true;
    if (auto) setNotice("🔊 읽는 중…");
  };
  u.onend = () => {
    if (auto && started) setNotice("");
  };
  u.onerror = (e) => {
    if (e.error !== "interrupted" && e.error !== "canceled") {
      row.speak.classList.add("hint");
      setNotice("읽기 오류(" + e.error + "): 🔊 버튼을 눌러 주세요", true);
    }
  };

  const go = () => {
    synth.resume(); // Android Chrome 에서 멈춤 상태로 남아 있는 경우가 있어 풀어 줌
    synth.speak(u);
    if (!auto) return;
    setTimeout(() => {
      if (started || row.trans.textContent.trim() !== text) return;
      if (!retried) {
        setNotice("🔊 자동 읽기 다시 시도…");
        speak(role, 800, true);
      } else {
        synth.cancel();
        row.speak.classList.add("hint");
        setNotice("이 휴대폰이 자동 읽기를 막았어요. 깜빡이는 🔊 버튼을 눌러 주세요", true);
      }
    }, 2000);
  };
  if (auto) {
    setNotice("🔊 자동 읽기 준비…");
    setTimeout(go, delayMs);
  } else {
    go();
  }
}

// ---- 자동 읽기 ----
const autoRead = document.getElementById("auto-read");
try { autoRead.checked = localStorage.getItem("autoRead") === "1"; } catch {}
let synthUnlocked = false;

// iPhone Safari 는 화면을 누른 순간에만 소리를 낼 수 있어서, 누를 때 빈 소리를 한 번 내서 풀어 둠
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
  || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function unlockSynth() {
  if (!synth || !isIOS || synthUnlocked || !autoRead.checked) return;
  synth.speak(new SpeechSynthesisUtterance(""));
  synthUnlocked = true;
}

function setAutoRead(on) {
  if (!synth) return;
  autoRead.checked = on;
  try { localStorage.setItem("autoRead", on ? "1" : "0"); } catch {}
  unlockSynth();
}

autoRead.addEventListener("change", () => setAutoRead(autoRead.checked));
if (!synth) autoRead.disabled = true;

// 말하는 중이면 끝난 뒤 읽고, 다른 사람이 말하는 중이면 방해하지 않도록 읽지 않음
function autoSpeak(role) {
  if (!autoRead.checked) return;
  if (active) {
    if (active.role === role) rows[role].pendingSpeak = true;
    return;
  }
  speak(role, 600);
}

for (const [role, row] of Object.entries(rows)) {
  if (!synth) row.speak.disabled = true;
  row.speak.addEventListener("click", () => speak(role));
}

document.getElementById("clear").addEventListener("click", () => {
  stop();
  if (synth) synth.cancel();
  for (const row of Object.values(rows)) {
    row.finalText = "";
    row.box.textContent = "";
    row.trans.textContent = "";
  }
});
</script>
</body>
</html>
